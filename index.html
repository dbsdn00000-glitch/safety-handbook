<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>현장안전 핸드북</title>

<!-- PWA 설정 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16232E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="안전핸드북">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E8F4FC;
    --bg-elev: #FFFFFF;
    --bg-elev-2: #DAEBF7;
    --line: #C4DFEF;
    --text: #16232E;
    --text-muted: #5D7182;
    --yellow: #B45309;
    --orange: #C2410C;
    --red: #B91C1C;
    --green: #15803D;
    --blue: #1D4ED8;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: #0B0C0E;
    font-family: var(--font-body);
    color: var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  /* ===== 앱 프레임 ===== */
  #app-frame{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  @media (min-width:520px){
    body{ padding: 28px 0; }
    #app-frame{ min-height: calc(100vh - 56px); border-radius: 28px; border:1px solid var(--line); }
  }

  /* ===== 헤이저드 스트라이프 (시그니처 요소) ===== */
  .hazard-strip{
    height:6px;
    width:100%;
    background: repeating-linear-gradient(
      -45deg,
      #FFC300 0 14px,
      #17181B 14px 28px
    );
    flex-shrink:0;
  }

  /* ===== 헤더 ===== */
  header{
    padding: 18px 18px 14px;
    background: var(--bg);
    position: sticky;
    top:0;
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .back-btn{
    width:36px; height:36px;
    border-radius: 10px;
    background: var(--bg-elev-2);
    border:1px solid var(--line);
    color: var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn svg{width:18px; height:18px;}
  .header-titles{ min-width:0; flex:1; }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--yellow);
    text-transform: uppercase;
    margin:0 0 2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  h1.page-title{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    line-height:1.05;
    margin:0;
    letter-spacing: -0.01em;
  }
  .home-title{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 30px;
    margin:0;
    letter-spacing: -0.01em;
  }
  .home-sub{
    font-size:13px;
    color: var(--text-muted);
    margin:4px 0 0;
    line-height:1.5;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding: 18px 18px 100px;
  }
  main.home-main{ padding: 0 0 100px; }
  main.image-main{ padding: 0; }

  /* ===== 이미지 전용 상세화면 (핀치줌, 화면 꽉채움) ===== */
  .float-back-row{
    position: sticky;
    top: 12px;
    z-index: 15;
    padding: 0 12px;
    pointer-events: none;
    height: 0;
  }
  .back-btn.floating{
    pointer-events: auto;
    background: rgba(12,14,17,0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
  }
  .zoom-wrap{
    position: relative;
    width: 100%;
    height: calc(100vh - 6px);
    height: calc(100dvh - 6px);
    min-height: 420px;
    background: #000;
    overflow: hidden;
    touch-action: pan-y;
  }
  .zoom-wrap + .zoom-wrap{
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .zoom-img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    touch-action: none;
    transform-origin: 0 0;
    will-change: transform;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .zoom-hint{
    position:absolute;
    left:50%; bottom:14px;
    transform: translateX(-50%);
    background: rgba(12,14,17,0.55);
    color:#fff;
    font-size:11px;
    font-family: var(--font-mono);
    padding: 5px 10px;
    border-radius: 999px;
    pointer-events:none;
    opacity: 0.85;
  }

  /* ===== 홈 히어로(전체 배경사진) ===== */
  .hero{
    position:relative;
    width:100%;
    height: 340px;
    background-size: cover;
    background-position: center 62%;
    display:flex;
    align-items:flex-end;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg,
      rgba(11,12,14,0.15) 0%,
      rgba(11,12,14,0.35) 45%,
      rgba(20,22,26,0.92) 88%,
      var(--bg) 100%);
  }
  .hero-content{
    position:relative;
    z-index:2;
    padding: 16px 18px 28px;
  }
  .hero .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color: #FFC300;
  }
  .hero .eyebrow::before{
    content:"";
    width:6px; height:6px;
    background: #FFC300;
    border-radius:50%;
    display:inline-block;
  }
  .hero .home-title{
    color: #FFFFFF;
    font-size: 34px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .hero .home-sub{
    color: #EAEAE6;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  .home-body{
    padding: 0 18px;
  }

  /* ===== 홈: 카테고리 카드 ===== */
  .cat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }
  .cat-card{
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 14px;
    cursor:pointer;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap: 26px;
    min-height: 128px;
    position:relative;
    transition: border-color .15s ease, transform .1s ease;
  }
  .cat-card:active{ transform: scale(0.97); }
  .cat-card:hover{ border-color: var(--accent); }
  .cat-icon{
    width:38px; height:38px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background: var(--accent-bg);
    color: var(--accent);
  }
  .cat-icon svg{ width:20px; height:20px; }
  .cat-name{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight:700;
    line-height:1.15;
  }
  .cat-count{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    position:absolute;
    top:14px; right:14px;
  }

  .disclaimer{
    margin-top:22px;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(255,195,0,0.07);
    border: 1px solid rgba(255,195,0,0.25);
    font-size: 12px;
    line-height:1.6;
    color: var(--text-muted);
  }
  .disclaimer b{ color: var(--yellow); }

  /* ===== 카테고리 상세: 하위 항목 리스트 ===== */
  .item-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top: 16px;
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--bg-elev);
    border:1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    cursor:pointer;
    text-align:left;
  }
  .item-row:active{ background: var(--bg-elev-2); }
  .item-icon{
    width:34px; height:34px;
    border-radius:9px;
    background: var(--accent-bg);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .item-icon svg{ width:17px; height:17px; }
  .item-text{ min-width:0; flex:1; }
  .item-title{
    font-weight:600;
    font-size:15px;
    margin:0 0 2px;
  }
  .item-summary{
    font-size:12.5px;
    color:var(--text-muted);
    margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chevron{ color: var(--text-muted); flex-shrink:0; }
  .chevron svg{ width:16px; height:16px; }

  /* ===== 상세 화면 ===== */
  .detail-image{
    width:100%;
    aspect-ratio: 16/10;
    border-radius: var(--radius);
    border: 1px dashed var(--line);
    background: var(--bg-elev);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color: var(--text-muted);
    margin-top: 4px;
    overflow:hidden;
  }
  .detail-image img{ width:100%; height:100%; object-fit:cover; }
  .detail-image svg{ width:30px; height:30px; opacity:0.6; }
  .detail-image span{ font-size:12px; font-family: var(--font-mono); }

  .section-block{ margin-top: 22px; }
  .section-heading{
    font-family: var(--font-display);
    font-weight:700;
    font-size: 18px;
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 10px;
  }
  .section-heading::before{
    content:"";
    width:4px; height:16px;
    background: var(--accent);
    border-radius:2px;
    display:inline-block;
  }
  ul.bullets{
    margin:0; padding:0;
    list-style:none;
    display:flex; flex-direction:column; gap:8px;
  }
  ul.bullets li{
    font-size: 14px;
    line-height:1.6;
    color: #34495A;
    padding-left: 16px;
    position:relative;
  }
  ul.bullets li::before{
    content:"";
    width:5px; height:5px;
    border-radius:50%;
    background: var(--text-muted);
    position:absolute;
    left:0; top:9px;
  }
  ul.bullets li b{ color: var(--text); }
  ul.bullets li.warn{ color: var(--orange); }
  ul.bullets li.warn::before{ background: var(--orange); }
  ul.bullets li.warn b{ color: var(--orange); }

  .step-list{
    margin:0; padding:0;
    list-style:none;
    display:flex; flex-direction:column; gap:0;
  }
  .step-list li{
    display:flex; gap:12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .step-list li:last-child{ border-bottom:none; }
  .step-num{
    font-family: var(--font-mono);
    font-weight:700;
    font-size:13px;
    color: var(--accent);
    background: var(--accent-bg);
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .step-body{ font-size:14px; line-height:1.6; color:#34495A; padding-top:2px; }
  .step-body b{ color:var(--text); }

  .metric-table{
    width:100%;
    border-collapse:collapse;
    font-family: var(--font-mono);
    font-size: 13px;
    margin-top:2px;
  }
  .metric-table th, .metric-table td{
    text-align:left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
  }
  .metric-table th{
    color: var(--text-muted);
    font-weight:500;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .metric-table td.val{ color: var(--yellow); font-weight:700; }
  .metric-table td.val.danger{ color: var(--red); }

  /* ===== 편집 안내 카드 (하위항목 목록 화면 하단) ===== */
  .edit-hint{
    margin-top:22px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px dashed var(--line);
    font-size: 12px;
    line-height:1.6;
    color: var(--text-muted);
  }

  /* ===== 긴급신고 버튼 ===== */
  .sos-btn{
    position:absolute;
    right:18px; bottom:18px;
    width:60px; height:60px;
    border-radius:50%;
    background: var(--red);
    color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-decoration:none;
    box-shadow: 0 6px 18px rgba(232,56,79,0.45);
    z-index: 20;
    font-family: var(--font-mono);
    animation: pulse 2.4s infinite;
  }
  .sos-btn svg{ width:18px; height:18px; margin-bottom:1px; }
  .sos-btn span{ font-size:10px; font-weight:700; letter-spacing:0.03em; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(232,56,79,0.5); }
    70%{ box-shadow: 0 0 0 14px rgba(232,56,79,0); }
    100%{ box-shadow: 0 0 0 0 rgba(232,56,79,0); }
  }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>

<div id="app-frame">
  <div class="hazard-strip"></div>
  <header id="header"></header>
  <main id="main"></main>
  <a class="sos-btn" href="tel:119" aria-label="119 긴급신고">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    <span>119</span>
  </a>
</div>

<script>
/* =====================================================================
   📌 데이터 영역 — 이 부분만 수정하면 앱 내용이 전부 바뀝니다.
   =====================================================================
   구조: CATEGORIES = [ 카테고리, 카테고리, ... ]

   [카테고리 하나 추가하는 법]
   아래 배열 맨 끝에 { } 객체를 하나 복사해서 붙여넣고 내용만 바꾸면
   메인 화면에 카드가 자동으로 하나 더 생깁니다.

   category 객체 = {
     id        : 'category-id-en'   (다른 카테고리와 겹치지 않는 영문 id)
     name      : '카테고리 이름'      (카드에 표시)
     icon      : 'ICONS.xxx'         (아래 ICONS 목록 중 하나, 또는 새로 추가)
     accent    : '#FFC300'           (이 카테고리 전용 포인트 색상)
     items     : [ 하위항목, 하위항목, ... ]
   }

   [하위 항목(눌렀을 때 상세가 열리는 것) 추가하는 법]
   items 배열 안에 { } 객체 하나를 추가합니다.

   item 객체 = {
     id      : 'item-id-en'
     title   : '항목 이름'            (리스트에 표시)
     icon    : 'ICONS.xxx'

     ── 방식 1) 사진만 크게 보여주기 (지금 대부분의 항목이 이 방식) ──
     images  : ['그림13.jpg']          → 사진 1장, 화면 꽉 채워서 표시
     images  : ['그림13.jpg','그림14.jpg']  → 여러 장이면 위→아래로 이어서 표시
               (각 사진은 손가락으로 확대/축소·이동 가능, 두 번 탭하면 확대/원복)
               ※ images 방식일 때는 글씨 없이 사진만 보여줍니다.
               ※ 사진 파일은 images 폴더 안에 넣고 파일명만 여기에 적으면 됩니다.

     ── 방식 2) 텍스트 위주로 보여주기 (예전 방식, 필요하면 계속 사용 가능) ──
     body    : { type:'bullets' | 'steps' | 'metrics', ... }

     ── body 형식 1) 목록형 (bullets) ──────────────────────
     body: {
       type: 'bullets',
       sections: [
         { heading:'섹션 제목', bullets: ['내용1', '내용2', {text:'경고 내용', warn:true} ] }
       ]
     }

     ── body 형식 2) 순서형 (steps) — 실제 절차/순서가 있을 때 ──
     body: {
       type: 'steps',
       sections: [
         { heading:'섹션 제목', steps: ['1단계 설명', '2단계 설명'] }
       ]
     }

     ── body 형식 3) 수치 기준표 (metrics) ─────────────────
     body: {
       type: 'metrics',
       sections: [
         { heading:'섹션 제목',
           rows: [ {label:'항목', value:'수치', danger:false} ] }
       ]
     }

     ※ 한 항목에 images와 body를 동시에 넣으면 images(사진 전용) 방식이 우선 적용됩니다.
   =====================================================================
*/

// ⬇️ 홈 화면 배경사진. 다른 사진으로 바꾸려면 이 data URL 전체를 교체하거나,
//    image: 'images/파일명.jpg' 형태의 짧은 경로로 바꿔서 사용해도 됩니다.
const HOME_BG_IMAGE = "images/그림1.jpg";

const ICONS = {
  manhole: `<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 6v6l4 2"/>`,
  permit: `<path d="M9 2h6l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M9 2v5h6"/><path d="M9 13h6M9 17h6"/>`,
  folder: `<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/>`,
  gear: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,

  gauge: `<path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M12 12l4-3"/><path d="M12 8v0"/>`,

// state
let state = { view: 'home', catId: null, itemId: null };

function findCat(id){ return CATEGORIES.find(c => c.id === id); }
function findItem(cat, id){ return cat.items.find(i => i.id === id); }

function icon(key){ return ICONS[key] || ICONS.doc; }

function go(view, catId, itemId){
  state = { view, catId: catId||null, itemId: itemId||null };
  render();
  document.getElementById('main').scrollTop = 0;
}

function render(){
  const header = document.getElementById('header');
  const main = document.getElementById('main');

  if(state.view === 'home'){
    header.innerHTML = '';
    main.className = 'home-main';

    main.innerHTML = `
      <div class="hero" style="background-image:url('${HOME_BG_IMAGE}')">
        <div class="hero-content">
          <p class="eyebrow">대전하수처리장</p>
          <h1 class="home-title">현장안전 핸드북</h1>
          <p class="home-sub">카테고리를 눌러 산업안전 정보를 확인하세요</p>
        </div>
      </div>
      <div class="home-body">
        <div class="cat-grid">
          ${CATEGORIES.map(c => `
            <button class="cat-card" style="--accent:${c.accent}; --accent-bg:${hexToRgba(c.accent,0.14)}" onclick="go('category','${c.id}')">
              <span class="cat-count">${c.items.length}개 항목</span>
              <span class="cat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon(c.icon)}</svg></span>
              <span class="cat-name">${c.name}</span>
            </button>
          `).join('')}
        </div>
        <div class="disclaimer"><b>안내.</b> 본 앱의 수치·절차는 일반적인 참고 자료입니다. 실제 작업 시에는 최신 산업안전보건 법령 및 사업장 자체 기준을 반드시 확인하세요.</div>
      </div>
    `;
    return;
  }
  main.className = '';

  const cat = findCat(state.catId);

  if(state.view === 'category'){
    header.innerHTML = headerBar(cat.name, '대전하수처리장', `go('home')`);
    main.innerHTML = `
      <div class="item-list">
        ${cat.items.map(it => `
          <button class="item-row" style="--accent:${cat.accent}; --accent-bg:${hexToRgba(cat.accent,0.14)}" onclick="go('detail','${cat.id}','${it.id}')">
            <span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon(it.icon)}</svg></span>
            <span class="item-text">
              <p class="item-title">${it.title}</p>
              <p class="item-summary">${it.summary||''}</p>
            </span>
            <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
          </button>
        `).join('')}
      </div>
      <div class="edit-hint">✏️ 새 항목은 코드 상단 <b>CATEGORIES</b> 데이터의 해당 카테고리 <b>items</b> 배열에 객체 하나만 추가하면 자동으로 이 목록에 나타납니다.</div>
    `;
    return;
  }

  if(state.view === 'detail'){
    const item = findItem(cat, state.itemId);

    // 방식 1) 사진 전용 (images 배열) — 글씨 없이 사진만 화면 꽉 채워 표시, 핀치줌 가능
    if(item.images && item.images.length){
      header.innerHTML = '';
      main.className = 'image-main';
      main.innerHTML = `
        <div class="float-back-row">
          <button class="back-btn floating" onclick="go('category','${cat.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
        </div>
        ${item.images.map((src, idx) => `
          <div class="zoom-wrap" data-idx="${idx}">
            <img class="zoom-img" src="images/${src}" alt="" draggable="false">
            ${idx===0 ? '<span class="zoom-hint">손가락으로 확대 · 두 번 탭하면 확대/축소</span>' : ''}
          </div>
        `).join('')}
      `;
      main.querySelectorAll('.zoom-wrap').forEach(wrap=>{
        setupPinchZoom(wrap, wrap.querySelector('.zoom-img'));
      });
      return;
    }

    // 방식 2) 텍스트형 상세 (예전 방식, body가 있는 항목만 해당)
    header.innerHTML = headerBar(item.title, cat.name, `go('category','${cat.id}')`);

    const imageBlock = item.image
      ? `<div class="detail-image"><img src="${item.image}" alt="${item.title}"></div>`
      : `<div class="detail-image">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon('camera')}</svg>
           <span>사진 준비중 — image 필드에 URL 추가 시 표시됩니다</span>
         </div>`;

    main.innerHTML = `
      ${imageBlock}
      ${renderBody(item.body, cat.accent)}
    `;
    return;
  }
}

function headerBar(title, eyebrow, backAction){
  return `
    <div class="header-row">
      <button class="back-btn" onclick="${backAction}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="header-titles">
        <p class="eyebrow">${eyebrow}</p>
        <h1 class="page-title">${title}</h1>
      </div>
    </div>`;
}

function renderBody(body, accent){
  if(!body || !body.sections) return '';
  return body.sections.map(sec => {
    const type = sec.type || body.type;
    let inner = '';
    if(type === 'bullets'){
      inner = `<ul class="bullets">${sec.bullets.map(b => {
        const isObj = typeof b === 'object';
        const text = isObj ? b.text : b;
        const warn = isObj && b.warn;
        return `<li class="${warn?'warn':''}">${text}</li>`;
      }).join('')}</ul>`;
    } else if(type === 'steps'){
      inner = `<ol class="step-list">${sec.steps.map((s,i) => `
        <li><span class="step-num" style="color:${accent}; background:${hexToRgba(accent,0.15)}">${i+1}</span><span class="step-body">${s}</span></li>
      `).join('')}</ol>`;
    } else if(type === 'metrics'){
      inner = `<table class="metric-table"><tbody>${sec.rows.map(r => `
        <tr><td>${r.label}</td><td class="val ${r.danger?'danger':''}">${r.value}</td></tr>
      `).join('')}</tbody></table>`;
    }
    return `<div class="section-block"><h2 class="section-heading">${sec.heading}</h2>${inner}</div>`;
  }).join('');
}

// 사진 확대/축소/이동 (핀치줌 + 드래그 + 더블탭)
function setupPinchZoom(wrapEl, imgEl){
  const MIN = 1, MAX = 4, DOUBLE_TAP_SCALE = 2.5;
  let scale = 1, panX = 0, panY = 0;
  let startDist = 0, startScale = 1;
  let isPanning = false, lastX = 0, lastY = 0;
  let lastTapTime = 0;

  function apply(){
    imgEl.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function clampPan(){
    // 확대되지 않았을 때는 이동값 초기화 (사진이 항상 보이도록)
    if(scale <= 1){ panX = 0; panY = 0; }
  }

  function dist(touches){
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  wrapEl.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2){
      startDist = dist(e.touches);
      startScale = scale;
    } else if(e.touches.length === 1){
      const now = Date.now();
      if(now - lastTapTime < 300){
        scale = scale > 1 ? 1 : DOUBLE_TAP_SCALE;
        clampPan();
        apply();
      } else if(scale > 1){
        isPanning = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
      lastTapTime = now;
    }
  }, { passive: true });

  wrapEl.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2){
      e.preventDefault();
      const d = dist(e.touches);
      scale = Math.min(MAX, Math.max(MIN, startScale * (d / startDist)));
      clampPan();
      apply();
    } else if(e.touches.length === 1 && isPanning){
      e.preventDefault();
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      panX += dx; panY += dy;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      apply();
    }
  }, { passive: false });

  wrapEl.addEventListener('touchend', (e) => {
    if(e.touches.length === 0){
      isPanning = false;
      if(scale <= 1){ scale = 1; clampPan(); apply(); }
    }
  });

  // 데스크톱(마우스)에서도 더블클릭으로 확대/축소 미리보기 가능하게
  wrapEl.addEventListener('dblclick', () => {
    scale = scale > 1 ? 1 : DOUBLE_TAP_SCALE;
    clampPan();
    apply();
  });
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
